<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Loja Farmasi</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header class="header">
    <h1>🛍️ Loja Farmasi</h1>
    <p>Beleza, Cuidado e Gestão</p>
  </header>

  <!-- Menu de Abas Independentes -->
  <nav class="nav-bar">
    <button class="nav-btn active" onclick="mudarAba('catalogo')">🛒 Catálogo</button>
    <button class="nav-btn" onclick="mudarAba('clientes')">👥 Clientes</button>
    <button class="nav-btn" onclick="mudarAba('admin')">⚙️ Gestão / Admin</button>
  </nav>

  <!-- ================= ABA 1: CATÁLOGO ================= -->
  <div id="aba-catalogo" class="pagina-conteudo ativa">
    <div class="categorias-scroll" id="lista-categorias">
      <!-- Categorias dinâmicas -->
    </div>

    <h2 class="section-title" id="titulo-categoria">Todos os Produtos</h2>
    <div id="produtos" class="grid-produtos">
      <!-- Produtos carregados via JS -->
    </div>
  </div>

  <!-- ================= ABA 2: CLIENTES ================= -->
  <div id="aba-clientes" class="pagina-conteudo">
    <div class="panel">
      <h2 class="section-title">➕ Cadastrar Novo Cliente</h2>
      <div class="form-group">
        <label>Nome Completo:</label>
        <input type="text" id="cli-nome" placeholder="Ex: Maria Silva">
      </div>
      <div class="form-group">
        <label>Telefone / WhatsApp:</label>
        <input type="text" id="cli-tel" placeholder="Ex: (11) 99999-9999">
      </div>
      <div class="form-group">
        <label>Endereço (Opcional):</label>
        <input type="text" id="cli-end" placeholder="Rua, Número, Bairro">
      </div>
      <button class="btn-primary" onclick="salvarCliente()">Salvar Cliente</button>
    </div>

    <div class="panel">
      <h2 class="section-title">📋 Lista de Clientes & Histórico Vitalício</h2>
      <div id="lista-clientes-container">
        <!-- Clientes listados aqui -->
      </div>
    </div>
  </div>

  <!-- ================= ABA 3: ADMIN / GESTÃO ================= -->
  <div id="aba-admin" class="pagina-conteudo">
    <!-- Gerir Categorias -->
    <div class="panel">
      <h2 class="section-title">🏷️ Gerir Categorias</h2>
      <div class="form-group">
        <label>Nova Categoria:</label>
        <input type="text" id="nova-cat-nome" placeholder="Ex: Maquiagem, Cuidados com a Pele, Perfume">
      </div>
      <button class="btn-primary" onclick="adicionarCategoria()">Adicionar Categoria</button>
    </div>

    <!-- Cadastrar Produto com Foto e Preços Editáveis -->
    <div class="panel">
      <h2 class="section-title">📦 Cadastrar Novo Produto</h2>
      <div class="form-group">
        <label>Nome do Produto:</label>
        <input type="text" id="prod-nome" placeholder="Ex: Batom Líquido Matte">
      </div>
      <div class="form-group">
        <label>Categoria:</label>
        <select id="prod-cat">
          <!-- Categorias preenchidas via JS -->
        </select>
      </div>
      <div class="form-group">
        <label>Link da Foto (URL):</label>
        <input type="text" id="prod-foto" placeholder="https://exemplo.com/foto.jpg">
      </div>
      <div class="form-group">
        <label>Descrição:</label>
        <textarea id="prod-desc" rows="2" placeholder="Breve descrição do produto..."></textarea>
      </div>
      <div class="form-group">
        <label>Valor de Compra (R$):</label>
        <input type="number" id="prod-compra" placeholder="45.00" step="0.01">
      </div>
      <div class="form-group">
        <label>Valor de Venda (R$):</label>
        <input type="number" id="prod-venda" placeholder="65.00" step="0.01">
      </div>
      <button class="btn-primary" onclick="adicionarProduto()">Salvar Produto no Catálogo</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
