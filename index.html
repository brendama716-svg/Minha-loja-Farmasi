<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Loja Farmasi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header class="header">
    <h1>🛍️ Loja Farmasi</h1>
    <p>Seus produtos favoritos a um toque de distância!</p>
  </header>

  <!-- Seção de Produtos -->
  <main class="container">
    <h2>Catálogo de Produtos</h2>
    <div id="produtos" class="grid-produtos">
      <!-- Os produtos serão carregados aqui via JavaScript -->
    </div>
  </main>

  <!-- Carrinho / Contato -->
  <footer class="footer">
    <button class="btn-whatsapp" onclick="enviarWhatsapp()">💬 Fazer Pedido via WhatsApp</button>
  </footer>

  <script src="script.js"></script>
</body>
</html>
